name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      # The committed site must rebuild byte-identically from data/changes.jsonl.
      - run: python -m fineprint build && git diff --exit-code -- site/ ':!site/feed.xml'
